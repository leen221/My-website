<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="google-site-verification" content="Rtni9wB0LKGR4l2A3UBiILWuvvVIRsAqfRMR6CR4G0Y" />
    <meta name="robots" content="noimageindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leen Thaher | AI & Robotics Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
        rel="stylesheet">
    <style>
        :root { --bg: #050508; --bg2: #0c0c14; --bg3: #12121e; --surface: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.07); --text: #f0f0f8; --muted: #7070a0; --faint: #303050; --violet: #7c3aed; --violet-light: #a78bfa; --cyan: #22d3ee; --pink: #e879f9; --green: #34d399; --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box }
        html { scroll-behavior: smooth }
        body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 300; overflow-x: hidden; cursor: none }
        .cursor { position: fixed; width: 12px; height: 12px; background: var(--violet-light); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s; mix-blend-mode: exclusion }
        .cursor-ring { position: fixed; width: 40px; height: 40px; border: 1.5px solid rgba(167, 139, 250, 0.4); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: all 0.15s ease }
        body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.4 }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0 60px; height: 72px; display: flex; align-items: center; justify-content: space-between; background: rgba(5, 5, 8, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border) }
        .logo { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, var(--violet-light), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent }
        .nav-links { display: flex; gap: 36px; list-style: none }
        .nav-links a { font-size: 13px; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s }
        .nav-links a:hover, .nav-links a.active { color: var(--text) }
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer }
        .bar { width: 24px; height: 2px; background: var(--text); transition: 0.3s }

        /* ---------- Centered stage (fills the page) ---------- */
        .stage { position: relative; min-height: 100vh; padding-top: 72px; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 2 }
        .coverflow { position: relative; width: 100%; height: 520px; display: flex; align-items: center; justify-content: center; touch-action: pan-y }

        .cf-card { position: absolute; left: 50%; top: 50%; width: 340px; height: 480px; margin-left: -170px; margin-top: -240px; border-radius: 20px; overflow: hidden; background: var(--bg3); border: 1px solid var(--border); cursor: pointer; user-select: none; transition: transform 0.5s cubic-bezier(.22,.61,.36,1), opacity 0.5s ease, filter 0.5s ease, box-shadow 0.5s ease }
        .cf-card.is-active { box-shadow: 0 25px 70px rgba(124, 58, 237, 0.45), 0 0 0 2px rgba(167, 139, 250, 0.5) }
        .cf-card img, .cf-card video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none }
        .cf-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.92) 5%, rgba(0,0,0,0.15) 55%, transparent 75%) }
        .cf-badge { position: absolute; top: 14px; left: 14px; background: rgba(5,5,8,0.65); backdrop-filter: blur(6px); border: 1px solid var(--border); padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600 }
        .cf-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.7); width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.12); backdrop-filter: blur(8px); border: 2px solid rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; font-size: 20px; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease }
        .cf-card.is-active .cf-play { opacity: 1; transform: translate(-50%, -50%) scale(1) }
        .cf-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 18px; opacity: 0; transition: opacity 0.4s ease }
        .cf-card.is-active .cf-info { opacity: 1 }
        .cf-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; margin-bottom: 4px }
        .cf-sub { font-size: 12px; color: var(--muted) }

        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 50; transition: all 0.2s ease; backdrop-filter: blur(10px) }
        .nav-arrow:hover { border-color: var(--violet-light); color: var(--violet-light); background: rgba(124, 58, 237, 0.12) }
        .nav-arrow.left { left: 30px }
        .nav-arrow.right { right: 30px }

        .dots { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 50 }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); cursor: pointer; transition: all 0.25s ease }
        .dot.is-active { background: var(--violet-light); width: 22px; border-radius: 4px }

        /* ---------- Modal viewer ---------- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(2,2,6,0.94); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 40px; cursor: auto }
        .modal-overlay.open { display: flex }
        .modal-content { max-width: 900px; width: 100%; position: relative }
        .modal-content img, .modal-content video { width: 100%; max-height: 82vh; border-radius: 14px; display: block; background: #000; object-fit: contain }
        .modal-caption { margin-top: 16px; text-align: center }
        .modal-caption h3 { font-family: var(--font-display); font-size: 20px; margin-bottom: 6px }
        .modal-caption p { color: var(--muted); font-size: 13px }
        .modal-close { position: absolute; top: -46px; right: 0; width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer }
        .modal-close:hover { border-color: var(--violet-light); color: var(--violet-light) }

        footer { padding: 30px 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); color: var(--faint); font-size: 12px }
        footer .footer-logo { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--faint) }

        @media(max-width:768px) {
            nav { padding: 0 24px }
            .nav-links { display: none; flex-direction: column; position: absolute; top: 72px; left: 0; right: 0; background: var(--bg2); padding: 20px 24px; gap: 16px; border-bottom: 1px solid var(--border) }
            .nav-links.open { display: flex }
            .hamburger { display: flex }
            .coverflow { height: 380px }
            .cf-card { width: 220px; height: 320px; margin-left: -110px; margin-top: -160px }
            .nav-arrow { width: 42px; height: 42px; font-size: 20px }
            .nav-arrow.left { left: 10px }
            .nav-arrow.right { right: 10px }
            footer { flex-direction: column; gap: 12px; padding: 24px }
        }
    
        /* ================= SITE-WIDE ANIMATION KIT ================= */
        .bg-orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none }
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(110px); will-change: transform }
        .bg-orb-a { width: 520px; height: 520px; top: -160px; left: -140px; opacity: .30; background: radial-gradient(circle, var(--violet) 0%, transparent 70%); animation: orbFloatA 20s ease-in-out infinite }
        .bg-orb-b { width: 460px; height: 460px; bottom: -180px; right: -140px; opacity: .24; background: radial-gradient(circle, var(--cyan) 0%, transparent 70%); animation: orbFloatB 24s ease-in-out infinite }
        .bg-orb-c { width: 380px; height: 380px; top: 38%; left: 58%; opacity: .14; background: radial-gradient(circle, var(--pink) 0%, transparent 70%); animation: orbFloatC 27s ease-in-out infinite }
        @keyframes orbFloatA { 0%, 100% { transform: translate(0, 0) scale(1) } 50% { transform: translate(70px, 50px) scale(1.15) } }
        @keyframes orbFloatB { 0%, 100% { transform: translate(0, 0) scale(1) } 50% { transform: translate(-60px, -40px) scale(1.12) } }
        @keyframes orbFloatC { 0%, 100% { transform: translate(0, 0) scale(1) } 50% { transform: translate(-50px, 35px) scale(1.2) } }

        .reveal { opacity: 0; transform: translateY(30px) scale(.97); transition: opacity .85s cubic-bezier(.16,.8,.24,1), transform .85s cubic-bezier(.16,.8,.24,1) }
        .reveal.visible { opacity: 1; transform: translateY(0) scale(1) }

        .nav-links a { position: relative }
        .nav-links a::after { content: ''; position: absolute; left: 0; right: 100%; bottom: -6px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--violet-light), var(--cyan)); transition: right .35s cubic-bezier(.16,.8,.24,1) }
        .nav-links a:hover::after, .nav-links a.active::after { right: 0 }

        [class*="-card"]:not(.float-card) { transition: transform .4s cubic-bezier(.16,.8,.24,1), box-shadow .4s ease, border-color .4s ease }

        .btn { position: relative; overflow: hidden; transition: transform .3s cubic-bezier(.16,.8,.24,1), box-shadow .3s ease }
        .btn::before { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,.25), transparent); transform: skewX(-20deg); transition: left .6s ease }
        .btn:hover::before { left: 120% }
        .btn:hover { transform: translateY(-3px) }

        @media(prefers-reduced-motion: reduce) {
            .bg-orb, .reveal, .btn::before { animation: none !important; transition: none !important }
        }
    </style>
</head>

<body>
    <div class="bg-orbs"><div class="bg-orb bg-orb-a"></div><div class="bg-orb bg-orb-b"></div><div class="bg-orb bg-orb-c"></div></div>
<div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <nav>
        <div class="logo">Leen Thaher</div>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="Certificates.html">Certificates</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="highlights.html">Highlights</a></li>
            <li><a href="ambitions.html">Goals</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="hamburger" id="hamburger">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </nav>

    <!-- ============================================================
         HOW TO ADD YOUR OWN PHOTOS & VIDEOS
         1) Put your image/video files in a folder next to this page,
            for example: media/photo1.jpg , media/video1.mp4
         2) Scroll to the <script> below and find "items".
         3) Copy one item block and edit: type, src, poster, badge, title, subtitle.
         4) Save. It appears automatically in the carousel.
       ============================================================ -->

    <section class="stage">
        <div class="nav-arrow left" id="prevBtn">&#8249;</div>
        <div class="coverflow" id="coverflow"></div>
        <div class="nav-arrow right" id="nextBtn">&#8250;</div>
        <div class="dots" id="dots"></div>
    </section>

    <footer>
        <div class="footer-logo">LT</div>
        <div>© 2025 Leen Thaher · Built with Code & AI</div>
        <div>Amman, Jordan 🇯🇴</div>
    </footer>

    <!-- Fullscreen viewer modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-close" id="modal-close">✕</div>
            <div id="modal-media"></div>
            <div class="modal-caption">
                <h3 id="modal-title"></h3>
                <p id="modal-sub"></p>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================
           EDIT THIS LIST TO ADD YOUR OWN PHOTOS & VIDEOS
           type: "image" or "video"
           src: path/URL to your image or video file
           poster: (video only) a thumbnail shown before it plays
           badge: small tag text, e.g. a date or emoji label
           title / subtitle: text shown on the active card
        ========================================================= */
        const items = [
            { type: "image", src: "https://picsum.photos/seed/leen1/600/850", badge: "⭐ Featured", title: "Robotics Workshop", subtitle: "2024 · Al-Balqa University" },
            { type: "video", src: "media/highlight-video1.mp4", poster: "https://picsum.photos/seed/leen2/600/850", badge: "🎬 Video", title: "AI Project Demo", subtitle: "2:14 · Capstone Project" },
            { type: "image", src: "https://picsum.photos/seed/leen3/600/850", badge: "⭐ Award", title: "QA Certification", subtitle: "2025 · Junior QA Tester" },
            { type: "image", src: "https://picsum.photos/seed/leen4/600/850", badge: "📸 Event", title: "Team Hackathon", subtitle: "2024 · 1st Place" },
            { type: "video", src: "media/highlight-video2.mp4", poster: "https://picsum.photos/seed/leen5/600/850", badge: "🎬 Video", title: "Robot Demo Reel", subtitle: "1:48 · Live Test Run" },
            { type: "image", src: "https://picsum.photos/seed/leen6/600/850", badge: "⭐ Featured", title: "Python & ML Training", subtitle: "2025 · Trainee Program" },
        ];

        const coverflow = document.getElementById("coverflow");
        const dotsWrap = document.getElementById("dots");
        let activeIndex = 0;

        function cardHTML(item, i) {
            const media = item.type === "video"
                ? `<video src="${item.src}" poster="${item.poster}" muted loop playsinline></video>`
                : `<img src="${item.src}" alt="${item.title}">`;
            const playIcon = item.type === "video" ? `<div class="cf-play">▶</div>` : "";
            return `
                <div class="cf-card" data-index="${i}" data-type="${item.type}" data-src="${item.src}" data-title="${item.title}" data-sub="${item.subtitle}">
                    ${media}
                    <div class="cf-overlay"></div>
                    <div class="cf-badge">${item.badge}</div>
                    ${playIcon}
                    <div class="cf-info">
                        <div class="cf-title">${item.title}</div>
                        <div class="cf-sub">${item.subtitle}</div>
                    </div>
                </div>`;
        }

        coverflow.innerHTML = items.map(cardHTML).join("");
        dotsWrap.innerHTML = items.map((_, i) => `<div class="dot" data-index="${i}"></div>`).join("");

        const cards = Array.from(document.querySelectorAll(".cf-card"));
        const dots = Array.from(document.querySelectorAll(".dot"));

        function render() {
            const total = cards.length;
            cards.forEach((card, i) => {
                let offset = i - activeIndex;
                if (offset > total / 2) offset -= total;
                if (offset < -total / 2) offset += total;
                const abs = Math.abs(offset);

                let scale = abs === 0 ? 1 : abs === 1 ? 0.72 : abs === 2 ? 0.5 : 0.4;
                const translateX = offset * 250;
                const opacity = abs > 3 ? 0 : 1 - abs * 0.28;
                const zIndex = 100 - abs;
                const brightness = abs === 0 ? 1 : Math.max(0.35, 1 - abs * 0.25);

                card.style.transform = `translateX(${translateX}px) scale(${scale})`;
                card.style.opacity = opacity;
                card.style.zIndex = zIndex;
                card.style.filter = `brightness(${brightness})`;
                card.style.pointerEvents = abs > 3 ? "none" : "auto";
                card.classList.toggle("is-active", abs === 0);

                const video = card.querySelector("video");
                if (video) {
                    if (abs === 0) { video.play().catch(() => {}); }
                    else { video.pause(); }
                }
            });
            dots.forEach((d, i) => d.classList.toggle("is-active", i === activeIndex));
        }

        function goTo(index) {
            const total = cards.length;
            activeIndex = ((index % total) + total) % total;
            render();
        }
        function next() { goTo(activeIndex + 1); }
        function prev() { goTo(activeIndex - 1); }

        render();

        // Click controls
        document.getElementById("nextBtn").addEventListener("click", next);
        document.getElementById("prevBtn").addEventListener("click", prev);
        dots.forEach(d => d.addEventListener("click", () => goTo(parseInt(d.dataset.index))));

        // Click a card: side card -> bring to center, active card -> open full view
        cards.forEach(card => {
            card.addEventListener("click", () => {
                const i = parseInt(card.dataset.index);
                if (i !== activeIndex) { goTo(i); return; }
                const { type, src, title, sub } = card.dataset;
                openModal(type, src, title, sub);
            });
        });

        // Keyboard arrow navigation
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") next();
            if (e.key === "ArrowLeft") prev();
            if (e.key === "Escape") closeModal();
        });

        // Drag / swipe with the mouse
        let dragging = false, startX = 0, dragMoved = 0;
        coverflow.addEventListener("mousedown", (e) => { dragging = true; startX = e.clientX; dragMoved = 0; });
        window.addEventListener("mousemove", (e) => {
            if (!dragging) return;
            dragMoved = e.clientX - startX;
        });
        window.addEventListener("mouseup", () => {
            if (!dragging) return;
            dragging = false;
            if (dragMoved > 60) prev();
            else if (dragMoved < -60) next();
        });
        // Touch swipe support
        let touchStartX = 0;
        coverflow.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        coverflow.addEventListener("touchend", (e) => {
            const diff = e.changedTouches[0].clientX - touchStartX;
            if (diff > 60) prev();
            else if (diff < -60) next();
        });

        // Modal viewer logic
        const modal = document.getElementById("modal");
        const modalMedia = document.getElementById("modal-media");
        const modalTitle = document.getElementById("modal-title");
        const modalSub = document.getElementById("modal-sub");

        function openModal(type, src, title, sub) {
            modalTitle.textContent = title;
            modalSub.textContent = sub;
            modalMedia.innerHTML = type === "video"
                ? `<video src="${src}" controls autoplay></video>`
                : `<img src="${src}" alt="${title}">`;
            modal.classList.add("open");
        }
        function closeModal() {
            modal.classList.remove("open");
            modalMedia.innerHTML = "";
        }
        document.getElementById("modal-close").addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

        // Shared site behaviors
        const currentPath = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-links a').forEach(link => { if (link.getAttribute('href') === currentPath) link.classList.add('active') });
        const cursor = document.getElementById('cursor'), ring = document.getElementById('cursor-ring');
        let mx = 0, my = 0, rx = 0, ry = 0;
        document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY });
        function animateCursor() { rx += (mx - rx) * 0.15; ry += (my - ry) * 0.15; cursor.style.left = mx + 'px'; cursor.style.top = my + 'px'; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; requestAnimationFrame(animateCursor) }
        animateCursor();
        document.querySelectorAll('a,button,.cf-card,.dot').forEach(el => { el.addEventListener('mouseenter', () => { cursor.style.transform = 'translate(-50%,-50%) scale(2.5)'; ring.style.transform = 'translate(-50%,-50%) scale(1.5)' }); el.addEventListener('mouseleave', () => { cursor.style.transform = 'translate(-50%,-50%) scale(1)'; ring.style.transform = 'translate(-50%,-50%) scale(1)' }) });
        document.getElementById('hamburger').addEventListener('click', () => document.getElementById('nav-links').classList.toggle('open'));
        document.querySelectorAll('#nav-links a').forEach(a => a.addEventListener('click', () => document.getElementById('nav-links').classList.remove('open')));
        window.addEventListener('scroll', () => { document.querySelector('nav').style.boxShadow = window.scrollY > 40 ? '0 8px 40px rgba(0,0,0,0.5)' : 'none' });
    </script>
    <script>
        // ===== SITE-WIDE ANIMATION KIT =====
        (function () {
            var orbs = document.querySelector('.bg-orbs');
            if (orbs) {
                window.addEventListener('scroll', function () {
                    var y = window.scrollY * 0.04;
                    orbs.style.transform = 'translateY(' + y + 'px)';
                }, { passive: true });
            }
            document.querySelectorAll('.btn').forEach(function (btn) {
                btn.addEventListener('mousemove', function (e) {
                    var r = btn.getBoundingClientRect();
                    var x = (e.clientX - r.left - r.width / 2) * 0.12;
                    var y = (e.clientY - r.top - r.height / 2) * 0.25;
                    btn.style.transform = 'translate(' + x + 'px,' + (y - 3) + 'px)';
                });
                btn.addEventListener('mouseleave', function () { btn.style.transform = ''; });
            });
        })();
    </script>
</body>

</html>
