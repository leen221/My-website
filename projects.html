<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="robots" content="noimageindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Leen Thaher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --bg2: #0c0c14;
            --bg3: #12121e;
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.07);
            --text: #f0f0f8;
            --muted: #7070a0;
            --faint: #303050;
            --violet: #7c3aed;
            --violet-light: #a78bfa;
            --cyan: #22d3ee;
            --pink: #e879f9;
            --green: #34d399;
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-weight: 300;
            overflow-x: hidden;
            cursor: none
        }

        .cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            background: var(--violet-light);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s;
            mix-blend-mode: exclusion
        }

        .cursor-ring {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1.5px solid rgba(167, 139, 250, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: all 0.15s ease
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.4
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 0 60px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 5, 8, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border)
        }

        .logo {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--violet-light), var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .nav-links {
            display: flex;
            gap: 36px;
            list-style: none
        }

        .nav-links a {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text)
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer
        }

        .bar {
            width: 24px;
            height: 2px;
            background: var(--text);
            transition: 0.3s
        }

        .section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 60px;
            position: relative;
            z-index: 1
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--violet-light);
            margin-bottom: 12px;
            display: block
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(32px, 4vw, 48px);
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 16px;
            line-height: 1
        }

        .section-sub {
            color: var(--muted);
            font-size: 16px;
            max-width: 500px;
            line-height: 1.7;
            margin-bottom: 60px
        }

        .proj-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px
        }

        .proj-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            position: relative
        }

        .proj-card:hover {
            border-color: rgba(124, 58, 237, 0.4);
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4)
        }

        .proj-thumb {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block
        }

        .proj-thumb-placeholder {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.12), rgba(34, 211, 238, 0.06))
        }

        .proj-body {
            padding: 22px
        }

        .proj-icon-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px
        }

        .proj-emoji {
            font-size: 22px
        }

        .proj-title {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 700
        }

        .proj-desc {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 14px
        }

        .proj-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .proj-tag {
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            background: rgba(124, 58, 237, 0.1);
            color: var(--violet-light);
            border: 1px solid rgba(124, 58, 237, 0.2)
        }

        .proj-click-hint {
            font-size: 11px;
            color: var(--violet-light);
            margin-top: 12px;
            opacity: 0.7;
            letter-spacing: 0.5px
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px)
        }

        .modal-overlay.open {
            display: flex
        }

        .modal-box {
            background: var(--bg2);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 24px;
            max-width: 760px;
            width: 100%;
            position: relative;
            animation: modalIn 0.3s ease;
            box-shadow: 0 0 80px rgba(124, 58, 237, 0.12);
            max-height: 90vh;
            overflow-y: auto
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.93) translateY(20px)
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0)
            }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 24px;
            color: var(--muted);
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
            z-index: 10
        }

        .modal-close:hover {
            color: var(--text)
        }

        .modal-gallery {
            display: flex;
            gap: 0;
            overflow-x: auto;
            border-radius: 24px 24px 0 0;
            scrollbar-width: none
        }

        .modal-gallery::-webkit-scrollbar {
            display: none
        }

        .modal-main-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 24px 24px 0 0;
            display: block
        }

        .modal-thumbs {
            display: flex;
            gap: 8px;
            padding: 12px 28px;
            background: var(--bg3)
        }

        .modal-thumb {
            width: 70px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            flex-shrink: 0
        }

        .modal-thumb.active,
        .modal-thumb:hover {
            border-color: var(--violet-light)
        }

        .modal-content {
            padding: 28px 32px 32px
        }

        .modal-proj-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px
        }

        .modal-proj-emoji {
            font-size: 32px
        }

        .modal-proj-title {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 800
        }

        .modal-proj-desc {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px
        }

        .modal-info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px
        }

        .modal-info-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px
        }

        .modal-info-val {
            font-size: 14px;
            color: var(--text)
        }
