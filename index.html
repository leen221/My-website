:root { --bg: #050508; --bg2: #0c0c14; --bg3: #12121e; --surface: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.07); --text: #f0f0f8; --muted: #8888b5; --faint: #303050; --violet: #7c3aed; --violet-light: #a78bfa; --cyan: #22d3ee; --pink: #e879f9; --green: #34d399; --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif; --font-mono: 'JetBrains Mono', monospace }
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box }
html { scroll-behavior: smooth }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 300; overflow-x: hidden; cursor: none }
.cursor { position: fixed; width: 12px; height: 12px; background: var(--violet-light); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s; mix-blend-mode: exclusion }
.cursor-ring { position: fixed; width: 40px; height: 40px; border: 1.5px solid rgba(167, 139, 250, 0.4); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: all 0.15s ease, opacity 0.2s; opacity: 0.35 }
body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.4 }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 0 60px; height: 72px; display: flex; align-items: center; justify-content: space-between; background: rgba(5, 5, 8, 0.7); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); transition: box-shadow 0.3s }
.logo { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, var(--violet-light), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent }
.nav-links { display: flex; gap: 36px; list-style: none }
.nav-links a { font-size: 13px; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; cursor: pointer }
.nav-links a:hover, .nav-links a.active { color: var(--text) }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer }
.bar { width: 24px; height: 2px; background: var(--text); transition: 0.3s }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 28px; border-radius: 8px; font-family: var(--font-body); font-size: 14px; font-weight: 500; letter-spacing: 0.3px; cursor: pointer; transition: all 0.25s; border: none; text-decoration: none }
.btn-violet { background: var(--violet); color: white; box-shadow: 0 0 30px rgba(124, 58, 237, 0.3) }
.btn-violet:hover { background: #6d28d9; box-shadow: 0 0 50px rgba(124, 58, 237, 0.5); transform: translateY(-2px) }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted) }
.btn-ghost:hover { border-color: var(--violet-light); color: var(--text); background: rgba(124, 58, 237, 0.05) }
.section { max-width: 1200px; margin: 0 auto; padding: 100px 60px; position: relative; z-index: 1 }
.section-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--violet-light); margin-bottom: 12px; display: block }
.section-label::before { content: "// "; color: var(--cyan); opacity: 0.7 }
.section-title { font-family: var(--font-display); font-size: clamp(32px, 4vw, 48px); font-weight: 800; letter-spacing: -1.5px; margin-bottom: 16px; line-height: 1 }
.section-sub { color: var(--muted); font-size: 16px; max-width: 500px; line-height: 1.7; margin-bottom: 60px }
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease }
.reveal.visible { opacity: 1; transform: translateY(0) }
.reveal-delay-1 { transition-delay: 0.1s }
.reveal-delay-2 { transition-delay: 0.2s }
.reveal-delay-3 { transition-delay: 0.3s }
footer { padding: 30px 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); color: var(--faint); font-size: 12px; position: relative; z-index: 1; background: var(--bg) }
footer .footer-logo { font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--faint) }
@media(max-width:768px) {
    nav { padding: 0 24px }
    .nav-links { display: none; flex-direction: column; position: absolute; top: 72px; left: 0; right: 0; background: var(--bg2); padding: 20px 24px; gap: 16px; border-bottom: 1px solid var(--border); max-height: calc(100vh - 72px); overflow-y: auto }
    .nav-links.open { display: flex }
    .hamburger { display: flex }
    .section { padding: 80px 24px 60px }
    footer { flex-direction: column; gap: 12px; padding: 24px }
}

/* ---- hero (cyber layout) ---- */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 28px; border-radius: 8px; font-family: var(--font-body); font-size: 14px; font-weight: 500; letter-spacing: 0.3px; cursor: pointer; transition: all 0.25s; border: none; text-decoration: none }
.btn-violet { background: var(--violet); color: white; box-shadow: 0 0 30px rgba(124, 58, 237, 0.3) }
.btn-violet:hover { background: #6d28d9; box-shadow: 0 0 50px rgba(124, 58, 237, 0.5); transform: translateY(-2px) }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted) }
.btn-ghost:hover { border-color: var(--violet-light); color: var(--text); background: rgba(124, 58, 237, 0.05) }

@keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0.3 } }
@keyframes pulse-orb { 0%, 100% { transform: scale(1) translate(0, 0) } 50% { transform: scale(1.1) translate(20px, -20px) } }

#hero { position: relative; min-height: 100vh; overflow: hidden; padding: 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center }

/* Global animated background: a subtle neural-network canvas fixed behind the ENTIRE site,
   visible continuously from Home through every section down to Contact. */
#bgNetwork { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; display: block }

.hero4-content { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px; padding: 140px 24px 40px; max-width: 640px }

.hero4-tag { font-family: var(--font-mono); display: inline-flex; align-items: center; gap: 8px; background: rgba(124, 58, 237, 0.1); border: 1px solid rgba(124, 58, 237, 0.3); padding: 6px 14px; border-radius: 100px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--violet-light) }
.hero4-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--violet-light); animation: blink 2s ease infinite; box-shadow: 0 0 8px var(--violet-light) }

.hero4-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 7vw, 76px); line-height: 1; letter-spacing: -1.5px; background: linear-gradient(135deg, var(--violet-light) 0%, var(--cyan) 55%, var(--pink) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent }
.hero4-sub { color: var(--muted); font-size: 17px; line-height: 1.7; font-weight: 300 }
.hero-stats { display: flex; gap: 32px; margin-top: 16px; padding-top: 20px; border-top: 1px solid var(--border) }
.stat { display: flex; flex-direction: column; align-items: center }
.stat-num { font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--cyan) }
.stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px }
.hero4-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px }

.hero4-badge { position: absolute; top: 100px; right: 40px; z-index: 4; display: flex; align-items: center; background: rgba(12, 12, 20, 0.75); border: 1px solid var(--border); backdrop-filter: blur(14px); border-radius: 100px; padding: 6px; gap: 0 }
.hero4-badge-photo { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 2px solid var(--violet-light); flex-shrink: 0 }
.hero4-badge-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top }
.hero4-badge span { padding: 0 14px; font-size: 12.5px; color: var(--text); font-family: var(--font-display); font-weight: 600; white-space: nowrap }
.hero4-badge-arrow { width: 34px; height: 34px; border-radius: 50%; background: var(--violet); display: flex; align-items: center; justify-content: center; color: #fff; text-decoration: none; font-size: 14px; flex-shrink: 0; transition: 0.2s }
.hero4-badge-arrow:hover { background: #6d28d9; transform: rotate(45deg) }

.hero4-scrolldown { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-decoration: none; opacity: 0.8; transition: opacity 0.2s }
.hero4-scrolldown:hover { opacity: 1; color: var(--text) }
.hero4-scrolldown span { display: inline-block; animation: float 2s ease-in-out infinite }
@keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }

@media(max-width: 768px) {
    .hero4-title { font-size: clamp(34px, 11vw, 48px) }
    .hero4-badge span { display: none }
    .hero4-badge { padding: 4px }
    .hero4-content { padding: 120px 20px 40px }
}
